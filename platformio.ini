[platformio]
default_envs = waveshare_p4_nano

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
extra_scripts = post:scripts/chip_info.py
monitor_speed = 115200
monitor_echo = yes
upload_speed = 460800
board_upload.flash_size = 16MB
board_upload.maximum_size = 2097152
board_build.flash_mode = dio
board_build.partitions = partitions.csv
build_flags = -Iinclude

[env:waveshare_p4_nano]
board = esp32-p4

[env:waveshare_p4_nano_rev3]
board = esp32-p4_r3
